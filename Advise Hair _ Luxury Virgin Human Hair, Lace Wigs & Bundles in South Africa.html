<style>
  :root {
    --bg: #F6F2EB; --surface: #FFFFFF; --ink: #0B0B0B; --muted: #5E574D; --line: rgba(11,11,11,.12);

    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F0E0C; --surface: #171512; --ink: #F6F2EB; --muted: #B5AC9E; --line: rgba(246,242,235,.14);

      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F0E0C; --surface: #171512; --ink: #F6F2EB; --muted: #B5AC9E; --line: rgba(246,242,235,.14);
    --gold: #D4AF37; --gold-ink: #E3C766; --chip: rgba(246,242,235,.06);
    color-scheme: dark;
  }
  html { scroll-behavior: smooth; scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 80px); }
  body { background: var(--bg); color: var(--ink); font-family: Jost, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: #0B0B0B; }
  img { max-width: 100%; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 4px; }
  .gold-text { background: linear-gradient(100deg, #9C7A1E 0%, #D4AF37 30%, #F3E3A6 50%, #D4AF37 70%, #9C7A1E 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .gold-btn { background: linear-gradient(120deg, #B8912A, #D4AF37 45%, #EBD382 60%, #C9A233); color: #0B0B0B; }
  .marquee { animation: marquee 38s linear infinite; }
  @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @media (prefers-reduced-motion: reduce) { .marquee { animation: none; } html { scroll-behavior: auto; } }
  input[type=range].compare { -webkit-appearance: none; appearance: none; background: transparent; }
  input[type=range].compare::-webkit-slider-thumb { -webkit-appearance: none; width: 44px; height: 44px; border-radius: 999px; background: transparent; cursor: ew-resize; }
  input[type=range].compare::-moz-range-thumb { width: 44px; height: 44px; border: 0; background: transparent; cursor: ew-resize; }
  .no-scrollbar::-webkit-scrollbar { display: none; } .no-scrollbar { scrollbar-width: none; }
  #boot { min-height: 100vh; display: grid; place-items: center; background: #0B0B0B; }

/* ---------- HairArt: generative image placeholders drawn as flowing strands ----------

function rng(seed) { let s = seed * 9301 + 49297; return () => ((s = (s * 9301 + 49297) % 233280) / 233280); }
function HairArt({ texture = "body", mood = "gold", seed = 1, label, className = "" }) {
  const id = useMemo(() => "h" + Math.random().toString(36).slice(2, 8), []);
  const paths = useMemo(() => {
    const r = rng(seed);
    const cfg = {
      straight: { amp: 4, freq: 0.006, n: 46 },
      body: { amp: 22, freq: 0.014, n: 40 },
      deep: { amp: 16, freq: 0.03, n: 42 },
      curly: { amp: 12, freq: 0.06, n: 44 },
      kinky: { amp: 7, freq: 0.12, n: 50 },
    }[texture];
    const out = [];
    for (let k = 0; k < cfg.n; k++) {
      const x0 = -40 + (k / cfg.n) * 380 + r() * 10;
      const ph = r() * Math.PI * 2, amp = cfg.amp * (0.7 + r() * 0.6), drift = (r() - 0.5) * 70;
      let d = "";
      for (let y = -20; y <= 440; y += 6) {
        const x = x0 + Math.sin(y * cfg.freq + ph) * amp + (y / 440) * drift + Math.sin(y * 0.004 + k * 0.3) * 18;
        d += (y === -20 ? "M" : "L") + x.toFixed(1) + " " + y;
      }
      out.push({ d, w: 0.5 + r() * 1.6, o: 0.25 + r() * 0.65 });
    }
    return out;
  }, [texture, seed]);
  const pal = {
    gold: ["#1A130A", "#3B2A12", "#D4AF37", "#F3E3A6"],
    noir: ["#0B0B0B", "#1D1915", "#6B5634", "#C9A85A"],
    dull: ["#2A2826", "#3A3734", "#7C7770", "#A7A19A"],
  }[mood];
  return (
    <div className={(/\babsolute\b/.test(className) ? "" : "relative ") + "overflow-hidden " + className} style={{ background: `radial-gradient(120% 90% at 30% 20%, ${pal[1]} 0%, ${pal[0]} 70%)` }}>

            <stop offset="0.62" stopColor={pal[3]} />
            <stop offset="1" stopColor={pal[1]} />
          </linearGradient>
        </defs>
        {paths.map((p, i) => <path key={i} d={p.d} fill="none" stroke={`url(#${id})`} strokeWidth={p.w} opacity={mood === "dull" ? p.o * 0.6 : p.o} />)}

      {label && <span className="absolute left-3 top-3 text-[11px] tracking-wide text-white/60">{label}</span>}

  );
}

/* ---------- Social proof: counters ---------- */
function Counter({ to, suffix = "", format = (n) => Math.round(n).toLocaleString("en-ZA").replace(/,/g, " ") }) {
  const ref = useRef(null);
  const inView = useInView(ref, { once: true, margin: "-60px" });
  const [val, setVal] = useState(0);
  const reduce = useReducedMotion();
  useEffect(() => {
    if (!inView) return;
    if (reduce) { setVal(to); return; }
    const c = animate(0, to, { duration: 2.2, ease: EASE, onUpdate: setVal });
    return () => c.stop();
  }, [inView]);
  return <span ref={ref}>{format(val)}{suffix}</span>;
}
function Stats() {
  const s = [
    { v: <Counter to={90} suffix="K+" />, l: "Community members across TikTok and Instagram" },

  ];
  return (

      <HairArt texture="straight" mood="noir" seed={77} className="absolute inset-0 opacity-50" />

}
